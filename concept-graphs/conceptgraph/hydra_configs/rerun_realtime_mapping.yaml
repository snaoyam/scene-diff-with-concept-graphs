defaults:
  - override hydra/job_logging: custom_logging_format
  - _self_

hydra:
  verbose: true
  run:
    dir: /node_data/urp26su_dongwoo/concept-graphs-project/hydra-logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ---- paths ----
repo_root: /node_data/urp26su_dongwoo/concept-graphs-project/concept-graphs
data_root: /node_data/urp26su_dongwoo/concept-graphs-project/Datasets

# Shared base for every stage's output, kept separate from dataset_root (which is
# read-only input data). Each SceneDiff pair gets its own outputs/<pair>/ folder, with
# concept_graphs/ (this script's obj_json, edge_json, pcd, detections/, ...),
# benchmark_data/ (scripts/convert_concept_graphs_to_scene_diff_benchmark_data.py's
# object_masks.pkl), and benchmark_result/ (scripts/run_scene_diff_benchmark.py's
# eval_result.txt) all nested underneath it. This default is used when nothing
# overrides it; scripts/run.sh passes output_root=... explicitly (like scene_pair=...)
# to every stage so all three agree on the same directory for a given run -- see
# --output_root in convert_concept_graphs_to_scene_diff_benchmark_data.py and
# run_scene_diff_benchmark.py, which forward it into their own hydra.compose() call.
output_root: ${repo_root}/../outputs

use_wandb: !!bool False

# dataset info
start: 0
end: -1
image_height: null # if null, it will be determined by dataconfig
image_width: null # if null, it will be determined by dataconfig

periodically_save_pcd: !!bool False
periodically_save_pcd_interval: 10

# This json file controls an early exit feature for the mapping script. It is
# periodically checked at every iteration of the loop within
# 'rerun_realtime_mapping.py'. When the 'exit_early' entry is set to true, the
# script will bypass its normal iterative processing loop and proceed directly
# to its final frame processing and cleanup phase. This allows for a quick
# termination of the mapping process, which can be useful in scenarios where
# immediate results are preferred or when it's necessary to halt processing
# due to external constraints. To trigger an early exit, manually edit this
# file by changing the value of 'exit_early' from false to true. The change
# will take effect at the next loop iteration.
exit_early_file: ${repo_root}/conceptgraph/hydra_configs/early_exit.json

device: cuda

use_iou: !!bool True
spatial_sim_type: overlap # "iou", "giou", "overlap"

# For contain_number
use_contain_number: !!bool False
contain_area_thresh: 0.95
contain_mismatch_penalty: 0.5

# Selection criteria on the 2D masks
mask_area_threshold: 25 # mask with pixel area less than this will be skipped
mask_conf_threshold: 0.10 # mask with lower confidence score will be skipped
max_bbox_area_ratio: null # boxes with larger areas than this will be skipped
max_mask_area_ratio: 0.60 # masks covering more than this fraction of the frame are skipped.
                          # Measured on bathroom_1_bathroom_2 (which has the frame-filling
                          # host masks this targets): obj/im AP 0.1445 -> 0.1517, obj/sc AP
                          # 0.3333 -> 0.3750, px/im IoU 0.3141 -> 0.3136, FP 5 -> 7. It is
                          # also what stops those masks bridging separate things into one
                          # node, which is why the object count rises (60 -> 89) -- the
                          # graph gets more fragmented and more correct at once.
                          # Sibling of max_bbox_area_ratio, but on the MASK rather than its
                          # box: a wall/floor/countertop mask is faithfully huge while its
                          # box is huge for any diagonally-oriented thin object too. Drops
                          # one frame's detection, never the object -- the object survives
                          # through its other frames -- so it can sit well above what a
                          # legitimate close-up ever reaches (measured on the SceneDiff GT:
                          # fewer than 0.5% of annotated objects ever exceed 0.5 in any
                          # single frame). null disables.

# SAM sprinkles speckle across a mask wherever it is unsure of a boundary -- e.g. a
# blanket draped over a sofa, where one sofa mask came out as 69-83 connected components.
# Those specks backproject into 3D as points scattered over whatever object is really
# there. Applied right after SAM (see remove_small_mask_components in utils/ious.py), so
# everything downstream, including the saved detections, works off the cleaned masks.
# Components smaller than this fraction of their own mask's area are dropped; 0 disables.
# The cut is relative, not an absolute pixel count, because speckle is a few pixels
# whatever the object's size: measured over one scan, speckle components were
# 0.009-0.031% of their mask while genuine occlusion splits were 2.0% and up -- a 64x
# gap, against only 4.6x on the absolute-pixel axis. The largest component is always kept.
mask_min_component_ratio: 0.03

# One object routinely picks up several near-identical masks under different labels:
# an open-vocab detector scores every vocabulary word against the same region, and
# YOLO's own NMS (agnostic_nms=False) only dedupes within a class. SAM, handed two
# nearly-identical boxes, returns the *identical* mask. Keep the highest-confidence one
# of any group whose masks reach this IoU; 0 disables.
# Measured over one scan: 96 pairs at an IoU of exactly 1.000 (sofa/couch,
# pillow/cushion, tote bag/shoe) and the next-highest pair at 0.745 -- nothing in
# between, so this threshold is not delicate. An earlier version of this stage keyed off
# CLIP+DINO similarity and regrouped frame to frame because those sat right on their
# threshold; mask IoU does not have that problem.
dedup_mask_iou_thresh: 0.9

# Confidence floor for taking part in mask_subtract_contained, which runs BEFORE
# filter_gobs so that detections too weak to become objects still carve their pixels out
# of whatever mask encloses them. This is a different question from mask_conf_threshold:
# that one asks "is this its own object?", this one asks "is something there at all?".
# Running the subtraction after the filter conflated the two -- a blanket detected at
# 0.178 got dropped, nothing carved it out of the sofa mask, and the sofa detection
# carried the blanket's pixels into 3D (dropped detections covered 13-53% of the
# surviving sofa mask, measured per frame).
# 0.0 lets everything YOLO emitted (predict conf=0.1) carve. Raising it means fewer
# spurious detections punching holes in real masks, at the cost of more host
# contamination -- and a hole is refilled by other frames while contamination is
# permanent, so erring low is the cheaper mistake.
mask_subtract_min_conf: 0.0

# DINO appearance is computed as a whole-frame dense feature map (one DINOv3
# forward pass per frame), then averaged per-object over its mask -- eroded by
# this many pixels first so the averaged feature excludes boundary pixels
# blended with a neighboring object or background.
dino_mask_erosion_px: 5

min_points_threshold: 16 # projected and sampled pcd with less points will be skipped

# Same-scan object fusion (see slam/geometric_fusion.py): 3D bbox gate -> association
# gate (strong/weak, see fusion_association_gate_mode), then merge every STRONG
# match (so a new observation can bridge nodes an earlier frame split apart) plus the
# single closest weak one. No periodic merge pass during the scan; a single global
# consolidation runs after the last frame instead. clip_ft/dino_ft/text_ft are never
# consulted for the fusion decision -- they're still extracted and stored for the
# before/after graph matching.
#
# A surface-normal-consistency gate also used to run after the ONLINE per-frame
# association gate above (evaluate_detection_gates). Dropped there: it was blind to two
# flush, same-facing surfaces anyway (abs() treats opposite-facing normals as agreeing,
# since estimate_normals leaves them unoriented), and it was actively rejecting genuine
# matches between different faces of the same large object growing within one
# continuous scan (e.g. a cabinet's front and side panel have legitimately different
# local normals), fragmenting large objects into one node per face.
#
# It's still used in the POST-SCAN global consolidation sweep (evaluate_object_pair_gates),
# where that reasoning doesn't transfer: this is a one-time pass over otherwise-unrelated
# surviving objects, not a single object growing face by face, and max(A->B, B->A) alone
# is specifically vulnerable there to a small object entirely resting against a larger,
# differently-angled surface (measured on one scan: removing this gate roughly tripled
# the rate of consolidation merges where one direction was ~1.0 and the other under 0.1 --
# one side's whole point cloud swallowed by the other's). Normal consistency catches most
# of those (genuinely different surface angles), though not the same-facing blind spot
# above -- fusion_normal_*/fusion_normal_consistency_thresh below are shared by both call
# sites (there's only one set of thresholds), but only evaluate_object_pair_gates reads
# them now.

fusion_bbox_margin: 0.02               # AABB candidate slack [m]; boxes within this distance
                                        # of each other count as overlapping, absorbing RGB-D
                                        # and pose noise. Candidate filtering only -- never a
                                        # merge criterion on its own.
fusion_point_overlap_thresh: 0.70      # gate on max(strong, weak).
                                        #   strong = how much of the detection this object explains;
                                        #            fails alone when a detection reveals surface the
                                        #            object has not accumulated yet (new viewpoint).
                                        #   weak   = how much of the object this detection covers,
                                        #            restricted to what this frame's camera should have
                                        #            seen (raw, unrestricted, it is biased low by partial
                                        #            masks and by whatever is not observable from here).
                                        # This same value also decides gate_class, and so the merge
                                        # policy: matches at or above it on the strong direction ALL
                                        # merge (rejoining a node an earlier frame split), while weak-only
                                        # matches are a contest that just the closest one wins -- a host
                                        # detection encloses every object resting on it, so merging all
                                        # of them would collapse a sofa and its contents into one node.
                                        # Also reused as the object-object threshold in the post-scan
                                        # consolidation, where there is no camera and the criterion is
                                        # max(A->B, B->A).
fusion_point_distance_factor: 1.5      # tau = downsample_voxel_size * this

fusion_visibility_depth_tolerance: 0.05 # z-buffer slack [m] for the occlusion test that builds O_vis:
                                        # an object point counts as visible when its camera-frame z is
                                        # <= the frame's measured depth + this. Absorbs pose drift and
                                        # surface slant; pixels with no depth reading are never counted.
fusion_min_visible_points: 16          # fewer visible object points than this carries no evidence, so
                                        # the pair falls back to the 3D strong ratio alone

# How BOTH association directions are measured.
#   projection -- (default) intersect the detection's 2D mask with the node's projected
#                 footprint once, then read strong and weak off it by dividing by
#                 |mask(D)| and |footprint(O)|. Sideways leakage across genuinely
#                 different-but-touching objects (a blanket draped on a sofa, a pillow
#                 resting on a cushion -- their 3D points can sit within tau of each other
#                 over a large contact area, not just a thin rim) is impossible on screen:
#                 a point a centimetre to the side lands on a different pixel/mask.
#                 Blind spot: a "before"-scan-seeded object's stale footprint (slam/utils.py's
#                 load_prior_scene_objects_as_seeds) can still swallow a new thin object
#                 placed flush against it, since the occlusion test's tolerance can't always
#                 tell "the same surface" from "something new sitting on top of it".
#   point_3d   -- nearest-neighbour ratios in 3D (fraction of one cloud within
#                 fusion_point_distance_factor * downsample_voxel_size of the other), no
#                 camera involved. Fixes the seeded-surface blind spot above, at the cost of
#                 reopening the sideways-leak risk projection was built to close. This is
#                 also the automatic fallback whenever projection can't be formed (no view,
#                 or too few of the object's points fall in this frame's frustum) --
#                 geometric_fusion._eroded_mask_subset trims the detection's own mask-boundary
#                 points first in that fallback case, but does not help the sideways leak in
#                 general (a small object whose ENTIRE mask sits near another's boundary, not
#                 just its edge, still leaks) and does not help the seeded-surface blind spot
#                 at all (that's a projection-mode-only failure).
fusion_association_gate_mode: projection

# Closing radius for the projected footprint used by projected_footprint() -- the
# association gate above (projection mode), visualization's fused_masks/ "-r" reprojection
# overlay, and cross-scan visibility counting for recognition-confidence and the
# before/after benchmark comparison all share it -- as a multiple of one voxel's pixel
# footprint:
#   radius[px] = this * fx * downsample_voxel_size / z   (median over the visible points)
# Closing fills the gaps voxel downsampling leaves (a detection's own cloud covers ~3% of its own
# mask) without moving the outer silhouette. Deriving the radius rather than fixing it in pixels
# matters because the reconstruction's scale is normalized, not metric. Raising it fills more
# interior holes but starts bleeding the silhouette outward onto whatever the object rests on.
fusion_projection_close_factor: 1.0

fusion_min_points_for_gates: 4         # pairs with fewer points than this auto-reject
fusion_global_consolidation_max_sweeps: 20  # safety cap on the post-scan merge-until-fixpoint loop

# evaluate_object_pair_gates (post-scan global consolidation) only -- see the comment
# above fusion_bbox_margin.
fusion_normal_radius_factor: 3.0       # normal estimation radius = downsample_voxel_size * this
fusion_normal_angle_thresh_deg: 30.0   # a correspondence agrees when |n_A . n_B| >= cos(this)
fusion_normal_consistency_thresh: 0.70 # required fraction of agreeing correspondences, counted
                                        # over the tau-inlier correspondences only
fusion_normal_max_nn: 30               # KDTreeSearchParamHybrid max_nn for estimate_normals

# Seed-descended objects only (slam/utils.py's load_prior_scene_objects_as_seeds): once a
# detection passes the spatial gate against the object's FULL geometry (seed + confirmed),
# a second spatial check runs against 'confirmed_pcd' alone -- the object's this-scan-only
# share, i.e. what its geometry would be if the carried-over seed points didn't exist. If
# that second check independently passes on its own, the object already has enough of
# THIS scan's own evidence and the match is accepted with no further check, same as any
# ordinary object. If not, spatial proximity to the (possibly stale) seed footprint alone
# isn't trusted -- CLIP+DINO similarity between the detection and the object must also
# clear this floor. Same formula, weights, and starting value as
# scenediff_semantic_sim_threshold/scenediff_clip_weight/scenediff_dino_weight (the
# offline before/after comparison's own appearance check) -- kept as a separate key since
# this one gates a live, per-frame decision rather than an after-the-fact comparison and
# may need retuning independently.
fusion_seed_semantic_sim_threshold: 0.62

# After every object's geometry is final, re-walk the whole sequence once more (no
# detection, just each frame's pose+depth) and for each object ask: over the frames
# from which this object's FINAL shape should have been visible (same frustum +
# z-buffer test the association gates use, gated on fusion_min_visible_points),
# how many actually had a detection merged into it (any single point of a mask
# counts -- see compute_recognition_confidence in slam/geometric_fusion.py)?
# confidence = recognized / should-have-been-visible. A pillow only ever caught
# from 3 of the 15 angles that exposed it is a real object stitched together
# correctly, but with weak evidence -- this is how that gets told apart from one
# seen from all 15. Cost is one extra depth/pose read per frame (no SAM/YOLO/CLIP),
# negligible next to the scan itself.
compute_recognition_confidence: !!bool True

# Minimums an object must MEET for annotate_recognition_trust (slam/geometric_fusion.py)
# to mark it recognition_trusted. NOTHING IS REMOVED either way: untrusted objects stay
# in the graph, in obj_json, and in the scene-graph render (drawn with a pale outline).
# The flag is consumed by the before/after benchmark comparison, which only asserts
# "removed"/"added" from trusted objects while still matching against every object on
# the other side regardless of its trust. An object too weak to claim a change from is
# still perfectly good evidence that something is there, which is why it is kept.
# No-op when compute_recognition_confidence is False -- no metric, no basis to doubt.
recognition_min_recognized_frames: 1    # must be recognized in at least this many frames
recognition_min_confidence: 0.40        # recognition_confidence must be at least this

# ---- Large-object exclusion (annotate_large_objects, slam/geometric_fusion.py) ----
#
# Furniture, walls, bathtubs and the like are not what this benchmark is about: across
# all 355 SceneDiff scene pairs, not one of the 1017 annotated changed objects is a
# wall, floor, ceiling, window or staircase -- they are all small things a person
# picked up and put down. Large nodes are pure liability here in two ways. They are
# reconstructed too unstably to compare across two scans, so noise in them surfaces as
# a spurious change; and while a scan is running their screen footprint swallows the
# small objects resting on them (see fusion_containment_weak_min below).
#
# Like recognition_trusted, is_large REMOVES NOTHING -- the object stays in the graph
# and stays available as a match target for the other scan. It only loses the right to
# assert added/removed/moved, and (during the scan) the right to absorb new detections.
#
# Primary criterion is 2D: the per-frame share of the image each of the object's own
# detection masks covered, taken at large_object_coverage_percentile. Calibrated
# against the same statistic computed over every GT object in the benchmark -- a
# threshold of 0.20 would exclude 2.9% of GT objects, 0.25 excludes 1.5%, 0.30 excludes
# 1.1%. A high percentile rather than the max so one runaway SAM mask cannot condemn an
# object, and rather than the mean so a big object filmed mostly from across the room
# still registers.
large_object_coverage_percentile: 90
large_object_coverage_thresh: 0.25      # null disables the 2D criterion
large_object_min_detections: 3          # too few masks for a percentile to mean anything
#
# Secondary criterion, OR-ed with the first: 3D size relative to the scene. The
# reconstruction's coordinates are an arbitrary (Pi3-estimated) scale -- scenes here
# span roughly 1 unit -- so this is a ratio against the scene's own diagonal, never an
# absolute length.
#
# It is doing the heavier lifting of the two, because it separates cases 2D cannot. On
# bathroom_1_bathroom_2 the single largest false positive was a clothes basket, whose
# 2D coverage (0.18) sits squarely inside the range legitimate GT objects reach but
# whose 3D ratio is 0.30; the bathtub is 0.36 on 0.20 coverage. Measured effect of
# turning this on at 0.30, with the 2D criterion unchanged at 0.25:
#   bathroom_1_bathroom_2   px/im IoU 0.1639 -> 0.3141   (FP 1,184,691 -> 361,549 px)
#                           obj/im AP 0.1416 -> 0.1445, obj/sc AP 0.3214 -> 0.3333
#                           TP 2 -> 2, FP 6 -> 5   (no true positive lost)
#   living_room_17_18       unchanged -- the 2D criterion already covered its one large
#                           node, and no other object came near either threshold
# For reference the SceneDiff baseline scores 0.3097 px/im IoU on that bathroom pair.
large_object_extent_ratio_thresh: 0.30

# While a scan runs, an object already marked is_large stops being offered as a fusion
# candidate for new detections, so it cannot keep swallowing what sits on it. It is NOT
# excluded from the post-scan object-object sweep (global_geometry_consolidation), so
# the fragments this splits a large surface into are collected back into one node at
# the end -- absorption is blocked, node identity is not.
#
# On the two pilot scenes this measured as an exact no-op: identical scores and identical
# object counts with it on and off. That is not evidence it does nothing in general, only
# that on these scenes max_mask_area_ratio had already removed the frame-filling masks
# through which a large node would have done its swallowing. Left on because it is the
# direct guard for the failure it names, and it costs nothing when nothing is large.
fusion_exclude_large_from_fusion: !!bool True

# Guard on the "strong" association direction, applied per DETECTION (in
# fuse_detections_geometry_only) rather than per candidate pair. The gate takes the
# better of
#   strong = |intersection| / |detection mask|    "how much of D does O explain?"
#   weak   = |intersection| / |object footprint|  "how much of O does D cover?"
# and a small mask lying entirely inside a big object's footprint scores strong ~= 1.0
# for that candidate even though it is nowhere near the whole of it -- e.g. a remote's
# mask sitting inside a coffee table's footprint. Left unguarded, that strong match
# fuses the remote's own (correctly-sized, separately tracked) object straight into the
# coffee table, discarding the remote's identity and geometry -- observed directly on
# living_room_17_living_room_18/before, mask_idx 0 ("remote"): at frame 1 it strong-
# matches curr_obj_num 2 ("coffee table", weak_overlap 0.09) while also weak-matching
# its own object (weak_overlap 1.0); at frame 2 its own object's weak_overlap comes
# back None (footprint didn't project that frame) so BOTH candidates read as strong
# with no weak match at all that frame.
#
# Because of that second case, this can't be gated on "a weak match exists this frame"
# -- it has to work from the STRONG candidates alone. A strong candidate is flagged as
# containment when its own weak_overlap is defined and below this value (None, i.e.
# "couldn't be measured", is never flagged -- that is not evidence of containment).
# Flagged candidates are only actually dropped from the merge when something else
# survives for the detection to attach to instead -- an unflagged strong candidate, or
# a weak match -- so a detection is never left with nowhere to merge. If every strong
# candidate is flagged and there is no weak match either, this can't tell identity from
# containment and declines to guess, leaving the original merge-them-all behaviour.
#
# An earlier, narrower version of this (gated strictly on "a weak match exists") missed
# the frame-2 case above -- the remote still ended up folded into the coffee table a
# frame later, taking on its class via the post-scan class-name majority vote, because
# the guard never got a chance to run once weak_ids was empty. An even earlier version
# used a CLIP+DINO appearance check as the backstop instead of this geometric one; that
# version fired even with no fallback present, and appearance at the 0.62 threshold
# tuned for whole-scan semantic matching was too strict for a single frame's crop -- on
# bathroom_1_bathroom_2 it wrongly rejected enough of those fallback-less cases to
# fragment the graph (89 -> 91 objects "before"), costing more (obj/sc AP 0.3750 ->
# 0.1111, FP 7 -> 9) than it gained (px/im IoU 0.3136 -> 0.3323). This version only
# ever acts when there is somewhere safe for the detection to go, so it does not carry
# that risk. null disables.
fusion_containment_weak_min: 0.15

# Ablation: revert same-scan object fusion from geometry-only back to the original
# ConceptGraph method it replaced -- per-frame 3D-bbox spatial similarity + CLIP
# visual similarity (sim_sum-aggregated), matched greedily and merged, plus a
# periodic overlap/appearance consolidation pass (instead of geometry-only fusion's
# single post-scan global_geometry_consolidation). See fuse_detections_geometry_only
# vs. mapping.py's compute_spatial_similarities/compute_visual_similarities/
# aggregate_similarities/match_detections_to_objects/merge_obj_matches, both wired
# into slam/rerun_realtime_mapping.py's per-frame fusion call site.
ablation_disable_geometry_only_fusion: !!bool False
ablation_match_method: "sim_sum"    # aggregate_similarities' only supported mode
ablation_phys_bias: 0.0             # sim_sum weighting between spatial_sim and visual_sim
ablation_sim_threshold: 1.2         # match_detections_to_objects' detection_threshold on agg_sim
ablation_merge_interval: 5          # run the periodic overlap/appearance merge every k frames
ablation_run_merge_final_frame: !!bool True
ablation_merge_overlap_thresh: 0.7      # -1 disables the periodic merge pass entirely
ablation_merge_visual_sim_thresh: 0.7   # merge only if CLIP visual similarity also clears this
ablation_merge_text_sim_thresh: 0.7     # merge only if class-name text similarity also clears this

# Ablation: ignore recognition_trusted (object confidence) and the cross-visibility
# gate in the before/after comparison (convert_concept_graphs_to_scene_diff_benchmark_data.py's
# classify_changes) -- every object, however weak its evidence, may assert
# added/removed/moved, and a trusted object the other scan's camera never saw is
# asserted removed/added instead of left unchanged. is_large exclusion
# (scenediff_exclude_large_objects) is a separate mechanism and unaffected.
ablation_disable_confidence_visibility_filter: !!bool False

# ---- before/after comparison (convert_concept_graphs_to_scene_diff_benchmark_data.py,
#      which reads this same yaml via hydra.compose; CLI flags there override these) ----
#
# Stage 1, geometry. Before any appearance is consulted, pairs whose AABBs overlap are
# scored by trimmed_surface_distance (pooled two-way nearest-neighbour distances, worst
# tail trimmed). At or under this distance the pair is matched 1:1 outright and skips
# the semantic stage entirely -- this is the "it simply did not move" case, and settling
# it geometrically keeps it off the semantic threshold's shoulders. The distance matches
# the tau used for position-only merging between frames during a scan
# (downsample_voxel_size 0.01 * fusion_point_distance_factor 1.5).
scenediff_geometric_match_max_distance: 0.015
scenediff_geometric_match_keep_fraction: 0.7   # average only the smallest this fraction of
                                                # the pooled distances, so partial overlap
                                                # between two scans doesn't veto a match
#
# Stage 2, appearance, for whatever stage 1 left unmatched. The score is the mean cosine
# similarity over EVERY (before frame, after frame) pair -- computed as one dot product
# of the objects' mean unit features, which is exactly equal (see clip_ft_mean in
# slam/utils.py). Many-to-many: one object may match several on the other side.
# Measured on living_room_17_living_room_18 over the pairs stage 1 left unmatched:
# same-class pairs scored 0.515 / 0.668 / 0.789 and the highest cross-class pair
# (shelf vs coffee table) 0.584, leaving a gap between 0.584 and 0.668. 0.62 is the
# midpoint of that gap. PROVISIONAL -- it is 21 pairs from one scene, measured against
# a pcd an earlier filter had already thinned, so re-check it once a full run produces
# unfiltered object sets on both sides.
scenediff_semantic_sim_threshold: 0.62
scenediff_clip_weight: 0.5
scenediff_dino_weight: 0.5
#
scenediff_max_match_distance: 1.5   # beyond this centroid distance a pair is never a match
scenediff_moved_threshold: 0.3      # a matched pair further apart than this counts as moved
scenediff_exclude_large_objects: !!bool True   # is_large objects may be matched against but
                                                # never asserted as added/removed/moved, exactly
                                                # as recognition_trusted=False objects are

# SceneDiff (github.com/yuqunw/scene_diff) video pairs, preprocessed into
# ScanNet-style RGB-D sequences by conceptgraph/dataset/scenediff_to_conceptgraph.py.
# Each SceneDiff pair produces two ConceptGraph scenes sharing one Pi3-estimated
# coordinate frame: <pair_name>/before and <pair_name>/after.
dataset_root: ${data_root}/scenediff

# SceneDiff pair name, without a before/after suffix. rerun_realtime_mapping.py
# runs the whole mapping pipeline twice per execution, once per scene_variant,
# overriding scene_variant on an independent config copy each time so the two
# ConceptGraphs are built without sharing any scene data.
scene_pair: living_room_17_living_room_18
scene_variant: before # overridden per run by rerun_realtime_mapping.py; valid values: "before", "after"
scene_id: ${scene_pair}/${scene_variant}
dataset_config: ${repo_root}/conceptgraph/dataset/dataconfigs/scenediff/${scene_id}.yaml

sam_variant: sam # sam
sam_encoder_version: "vit_h"
sam_checkpoint_path: /node_data/urp26su_dongwoo/repos/new_segment_anything/Grounded-Segment-Anything/sam_vit_h_4b8939.pth
mobile_sam_path: /node_data/urp26su_dongwoo/repos/new_segment_anything/Grounded-Segment-Anything/mobile_sam.pt

# DINOv3 appearance embedding (per-mask, computed alongside CLIP's clip_ft -- see dino_ft)
dinov3_repo_dir: /node_data/urp26su_dongwoo/concept-graphs-project/dinov3
dinov3_checkpoint_path: ${dinov3_repo_dir}/dinov3_vith16plus_pretrain_lvd1689m-7c1da9a5.pth
dinov3_model_name: dinov3_vith16plus

# Dynamic per-scene-variant vocabulary discovery (replaces the old fixed
# classes_file: scannet200_classes.txt limited detection to ~200 ScanNet
# classes, too narrow for arbitrary scenes). See discover_scene_vocabulary()
# in utils/general_utils.py.
discovery_voxel_size: 0.1               # coarse (10x downsample_voxel_size) -- measuring which broad
                                         # regions a frame sees, not fine reconstruction detail
discovery_pixel_stride: 4               # subsample every 4th pixel when backprojecting a frame for
                                         # coverage; keeps the per-scene coverage pre-pass fast
discovery_max_representative_frames: null   # optional hard cap on greedy-selected frames (null = uncapped;
                                             # the coverage stopping criterion is already self-limiting)
discovery_sam_conf: 0.25                # SAM top-level box-confidence filter (ultralytics' own default).
                                         # Note: SAM automatic-mode point-grid density (points_stride) is NOT
                                         # exposed here -- the installed ultralytics version doesn't forward
                                         # generate()-specific kwargs through predict(), only `conf` reaches it.
discovery_sam_min_segment_area_px: 400  # drop tiny/degenerate SAM segments before spending a VLM call
                                         # on them (distinct from mask_area_threshold=25 below, which
                                         # gates a much cheaper stage -- a VLM round trip needs a higher bar)
discovery_sam_max_segment_area_ratio: 0.85  # drop near-whole-frame segments (walls/floors), analogous
                                             # to max_bbox_area_ratio but a separate knob for this stage
discovery_sam_max_segments_per_frame: 60    # hard cap on segments kept per frame after filtering (keeps
                                             # the largest); primary lever for bounding VLM call volume

# ---- Ablation switches ----
# Isolate each of the three pipeline changes (scene-specific vocabulary discovery,
# geometry-only fusion, confidence/visibility filtering) by reverting just that one
# to its pre-improvement behaviour, so its individual contribution to the SceneDiff
# benchmark score can be measured. All three default to False (full pipeline).

# Skip discover_scene_vocabulary() and use this fixed classes file instead -- the
# exact ScanNet200 list every scene used before per-scene discovery replaced it.
# Written into the same discovered_classes.txt cache discovery would have produced,
# so the run_detections=False (cached-detections) branch needs no changes either way.
ablation_disable_vocabulary_discovery: !!bool False
ablation_fixed_vocabulary_classes_file: ${repo_root}/conceptgraph/scannet200_classes.txt

bg_classes: ["wall", "floor", "ceiling"]
skip_bg: !!bool False

# Name of the folder (under <dataset_root>/<scene_id>/) that experiment
# outputs are organized into, i.e. output paths are
# <dataset_root>/<scene_id>/<exps_dir_name>/<exp_suffix|detections_exp_suffix>/
exps_dir_name: exps

force_detection: !!bool False
save_detections: !!bool True

make_edges: !!bool True
# Edge relations are built once, after all frames are processed, from the
# final point cloud (build_final_object_graph in slam/utils.py): objects get
# an edge iff their robust min surface distance is <= n * (combined radius),
# where n is auto-selected per scene as the smallest value that leaves no
# object isolated -- no manual tuning knob needed here.

# Per-object VLM captions, gathered every frame (get_vlm_captions) and consolidated
# into one caption per object at the end (consolidate_captions). Independent of
# make_edges -- edges no longer come from captions, they're derived from 3D geometry.
make_captions: !!bool False

stride: 1 # scenediff frames are already sparsely sampled during preprocessing

save_video: !!bool False
save_objects_all_frames: !!bool False

downsample_voxel_size: 0.01
obj_pcd_max_points: 5000

denoise_interval: 5           # Run DBSCAN every k frame. This operation is heavy
filter_interval: 5            # Filter objects that have too few associations or are too small
run_denoise_final_frame: !!bool True
run_filter_final_frame: !!bool True

dbscan_remove_noise: !!bool True
dbscan_eps: 0.1
dbscan_min_points: 10

# Selection criteria of the fused object point cloud
obj_min_points: 0
obj_min_detections: 1

# 2D scene graph overlay visualization: saves one PNG per frame with detections
# (image + colored mask overlay | node/edge graph diagram) under
# <exp_out_path>/scenegraph_viz/

# Per-frame overlay of the LIVE fused map, under <exp_out_path>/fused_masks/. Written
# progressively inside the frame loop (right after each frame's own matching/merging),
# not after the whole scan finishes, so playing the frames in order shows objects
# merging over time -- two masks/numbers becoming one -- instead of only the finished
# result. Numbered by curr_obj_num (stable once an object exists, even across merges),
# but colors are positional per frame like detected_masks/filtered_masks, not fixed
# across frames. Detections that already fused into one node this frame are drawn as
# one mask. An object with no fresh detection this frame (e.g. the detector missed it)
# is not just dropped: it is still drawn, reprojected from its stored 3D point cloud,
# whenever this frame's camera should still see it -- in-frustum, unoccluded (per the
# frame's own depth map, using fusion_visibility_depth_tolerance), and with at least
# fusion_min_visible_points surviving points. Its label is suffixed "-r" to mark
# it as a geometric guess rather than an actual detection this frame.

# Whole-scene object graph (all persistent objects/edges in the final map,
# not per-frame): saved as <exp_out_path>/scenegraph_full.png once mapping
# finishes (reads back the just-saved obj_json/edge_json).
