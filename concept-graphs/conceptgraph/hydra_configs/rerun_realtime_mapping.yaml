defaults:
  - override hydra/job_logging: custom_logging_format
  - _self_

hydra:
  verbose: true
  run:
    dir: /node_data/urp26su_dongwoo/concept-graphs-project/hydra-logs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# ---- paths ----
repo_root: /node_data/urp26su_dongwoo/concept-graphs-project/concept-graphs
data_root: /node_data/urp26su_dongwoo/concept-graphs-project/Datasets

# Shared base for every stage's output, kept separate from dataset_root (which is
# read-only input data). Each SceneDiff pair gets its own outputs/<pair>/ folder, with
# concept_graphs/ (this script's obj_json, edge_json, pcd, detections/, ...),
# benchmark_data/ (scripts/convert_concept_graphs_to_scene_diff_benchmark_data.py's
# object_masks.pkl), and benchmark_result/ (scripts/run_scene_diff_benchmark.py's
# eval_result.txt) all nested underneath it -- see scripts/output_paths.py, which reads
# this same value for the latter two stages.
output_root: ${repo_root}/../outputs

use_wandb: !!bool False

# dataset info
start: 0
end: -1
image_height: null # if null, it will be determined by dataconfig
image_width: null # if null, it will be determined by dataconfig

periodically_save_pcd: !!bool False
periodically_save_pcd_interval: 10

# This json file controls an early exit feature for the mapping script. It is
# periodically checked at every iteration of the loop within
# 'rerun_realtime_mapping.py'. When the 'exit_early' entry is set to true, the
# script will bypass its normal iterative processing loop and proceed directly
# to its final frame processing and cleanup phase. This allows for a quick
# termination of the mapping process, which can be useful in scenarios where
# immediate results are preferred or when it's necessary to halt processing
# due to external constraints. To trigger an early exit, manually edit this
# file by changing the value of 'exit_early' from false to true. The change
# will take effect at the next loop iteration.
exit_early_file: ${repo_root}/conceptgraph/hydra_configs/early_exit.json

device: cuda

use_iou: !!bool True
spatial_sim_type: overlap # "iou", "giou", "overlap"
phys_bias: 0.0
match_method: "sim_sum" # "sep_thresh", "sim_sum"
# Only when match_method=="sep_thresh"
semantic_threshold: 0.5
physical_threshold: 0.5
# Only when match_method=="sim_sum"
sim_threshold: 1.2

# For contain_number
use_contain_number: !!bool False
contain_area_thresh: 0.95
contain_mismatch_penalty: 0.5

# Selection criteria on the 2D masks
mask_area_threshold: 25 # mask with pixel area less than this will be skipped
mask_conf_threshold: 0.10 # mask with lower confidence score will be skipped
max_bbox_area_ratio: null # boxes with larger areas than this will be skipped

# SAM sprinkles speckle across a mask wherever it is unsure of a boundary -- e.g. a
# blanket draped over a sofa, where one sofa mask came out as 69-83 connected components.
# Those specks backproject into 3D as points scattered over whatever object is really
# there. Applied right after SAM (see remove_small_mask_components in utils/ious.py), so
# everything downstream, including the saved detections, works off the cleaned masks.
# Components smaller than this fraction of their own mask's area are dropped; 0 disables.
# The cut is relative, not an absolute pixel count, because speckle is a few pixels
# whatever the object's size: measured over one scan, speckle components were
# 0.009-0.031% of their mask while genuine occlusion splits were 2.0% and up -- a 64x
# gap, against only 4.6x on the absolute-pixel axis. The largest component is always kept.
mask_min_component_ratio: 0.03

# One object routinely picks up several near-identical masks under different labels:
# an open-vocab detector scores every vocabulary word against the same region, and
# YOLO's own NMS (agnostic_nms=False) only dedupes within a class. SAM, handed two
# nearly-identical boxes, returns the *identical* mask. Keep the highest-confidence one
# of any group whose masks reach this IoU; 0 disables.
# Measured over one scan: 96 pairs at an IoU of exactly 1.000 (sofa/couch,
# pillow/cushion, tote bag/shoe) and the next-highest pair at 0.745 -- nothing in
# between, so this threshold is not delicate. An earlier version of this stage keyed off
# CLIP+DINO similarity and regrouped frame to frame because those sat right on their
# threshold; mask IoU does not have that problem.
dedup_mask_iou_thresh: 0.9

# Confidence floor for taking part in mask_subtract_contained, which runs BEFORE
# filter_gobs so that detections too weak to become objects still carve their pixels out
# of whatever mask encloses them. This is a different question from mask_conf_threshold:
# that one asks "is this its own object?", this one asks "is something there at all?".
# Running the subtraction after the filter conflated the two -- a blanket detected at
# 0.178 got dropped, nothing carved it out of the sofa mask, and the sofa detection
# carried the blanket's pixels into 3D (dropped detections covered 13-53% of the
# surviving sofa mask, measured per frame).
# 0.0 lets everything YOLO emitted (predict conf=0.1) carve. Raising it means fewer
# spurious detections punching holes in real masks, at the cost of more host
# contamination -- and a hole is refilled by other frames while contamination is
# permanent, so erring low is the cheaper mistake.
mask_subtract_min_conf: 0.0

# DINO appearance is computed as a whole-frame dense feature map (one DINOv3
# forward pass per frame), then averaged per-object over its mask -- eroded by
# this many pixels first so the averaged feature excludes boundary pixels
# blended with a neighboring object or background.
dino_mask_erosion_px: 5

min_points_threshold: 16 # projected and sampled pcd with less points will be skipped

# For merge_overlap_objects() function
merge_overlap_thresh: 0.7      # -1 means do not perform the merge_overlap_objects()
merge_visual_sim_thresh: 0.7   # Merge only if the visual similarity is larger
merge_text_sim_thresh: 0.7     # Merge only if the text cosine sim is larger

# Same-scan object fusion mode -- how a new detection is associated with existing
# map objects (see slam/geometric_fusion.py).
#   "geometry_only": 3D bbox gate -> association gate (strong/weak, see
#                    fusion_association_gate_mode) -> surface normal consistency gate,
#                    then merge every STRONG match (so a new observation can bridge nodes
#                    an earlier frame split apart) plus the single closest weak one.
#                    No periodic merge_objects(); a single global consolidation runs
#                    after the last frame instead. clip_ft/dino_ft/text_ft are never
#                    consulted for the fusion decision -- they're still extracted and
#                    stored for the before/after graph matching.
#   "appearance":    the original spatial_sim + CLIP visual_sim (sim_sum) association
#                    plus the merge_interval-driven merge_objects() above.
object_fusion_mode: geometry_only

fusion_bbox_margin: 0.02               # AABB candidate slack [m]; boxes within this distance
                                        # of each other count as overlapping, absorbing RGB-D
                                        # and pose noise. Candidate filtering only -- never a
                                        # merge criterion on its own.
fusion_point_overlap_thresh: 0.70      # gate on max(strong, weak).
                                        #   strong = how much of the detection this object explains;
                                        #            fails alone when a detection reveals surface the
                                        #            object has not accumulated yet (new viewpoint).
                                        #   weak   = how much of the object this detection covers,
                                        #            restricted to what this frame's camera should have
                                        #            seen (raw, unrestricted, it is biased low by partial
                                        #            masks and by whatever is not observable from here).
                                        # This same value also decides gate_class, and so the merge
                                        # policy: matches at or above it on the strong direction ALL
                                        # merge (rejoining a node an earlier frame split), while weak-only
                                        # matches are a contest that just the closest one wins -- a host
                                        # detection encloses every object resting on it, so merging all
                                        # of them would collapse a sofa and its contents into one node.
                                        # Also reused as the object-object threshold in the post-scan
                                        # consolidation, where there is no camera and the criterion is
                                        # max(A->B, B->A).
fusion_point_distance_factor: 1.5      # tau = downsample_voxel_size * this

fusion_visibility_depth_tolerance: 0.05 # z-buffer slack [m] for the occlusion test that builds O_vis:
                                        # an object point counts as visible when its camera-frame z is
                                        # <= the frame's measured depth + this. Absorbs pose drift and
                                        # surface slant; pixels with no depth reading are never counted.
fusion_min_visible_points: 16          # fewer visible object points than this carries no evidence, so
                                        # the pair falls back to the 3D strong ratio alone

# How BOTH association directions are measured.
#   projection -- intersect the detection's 2D mask with the node's projected footprint once, then
#                 read strong and weak off it by dividing by |mask(D)| and |footprint(O)|.
#   point_3d   -- the previous nearest-neighbour ratios in 3D (fraction of one cloud within tau of
#                 the other), kept so a run can be compared against the old behaviour.
# 3D leaks sideways, because "some point lies within tau" is much weaker evidence than pixel
# containment. Measured on living_room_17: the weak direction scored 0.28-0.49 for the sofa against
# a handbag resting on it in every frame, and 0.90 once the frame border cropped the bag down to its
# contact band -- which destroyed that node; on screen the same comparisons give 0.00-0.01 while the
# bag's own mask still scores 0.89-0.99. The strong direction leaks the same way but more mildly:
# 20 merges scored 1.000 in 3D for small frame-clipped detections against the big sofa node, and
# re-scoring 15 of them on screen put two below this threshold and most of the rest well under 1.0.
fusion_association_gate_mode: projection

# Closing radius for the projected footprint, as a multiple of one voxel's pixel footprint:
#   radius[px] = this * fx * downsample_voxel_size / z   (median over the visible points)
# Closing fills the gaps voxel downsampling leaves (a detection's own cloud covers ~3% of its own
# mask) without moving the outer silhouette. Deriving the radius rather than fixing it in pixels
# matters because the reconstruction's scale is normalized, not metric. Raising it fills more
# interior holes but starts bleeding the silhouette outward onto whatever the object rests on.
fusion_projection_close_factor: 1.0

fusion_normal_radius_factor: 3.0       # normal estimation radius = downsample_voxel_size * this
fusion_normal_angle_thresh_deg: 30.0   # a correspondence agrees when |n_D . n_O| >= cos(this)
fusion_normal_consistency_thresh: 0.70 # required fraction of agreeing correspondences, counted
                                        # over the tau-inlier correspondences only

fusion_normal_max_nn: 30               # KDTreeSearchParamHybrid max_nn for estimate_normals
fusion_min_points_for_gates: 4         # pairs with fewer points than this auto-reject
fusion_global_consolidation_max_sweeps: 20  # safety cap on the post-scan merge-until-fixpoint loop
fusion_debug_log: !!bool True          # write <exp_out_path>/fusion_debug/*.jsonl

# SceneDiff (github.com/yuqunw/scene_diff) video pairs, preprocessed into
# ScanNet-style RGB-D sequences by conceptgraph/dataset/scenediff_to_conceptgraph.py.
# Each SceneDiff pair produces two ConceptGraph scenes sharing one Pi3-estimated
# coordinate frame: <pair_name>/before and <pair_name>/after.
dataset_root: ${data_root}/scenediff

# SceneDiff pair name, without a before/after suffix. rerun_realtime_mapping.py
# runs the whole mapping pipeline twice per execution, once per scene_variant,
# overriding scene_variant on an independent config copy each time so the two
# ConceptGraphs are built without sharing any scene data.
scene_pair: living_room_17_living_room_18
scene_variant: before # overridden per run by rerun_realtime_mapping.py; valid values: "before", "after"
scene_id: ${scene_pair}/${scene_variant}
dataset_config: ${repo_root}/conceptgraph/dataset/dataconfigs/scenediff/${scene_id}.yaml

sam_variant: sam # sam
sam_encoder_version: "vit_h"
sam_checkpoint_path: /node_data/urp26su_dongwoo/repos/new_segment_anything/Grounded-Segment-Anything/sam_vit_h_4b8939.pth
mobile_sam_path: /node_data/urp26su_dongwoo/repos/new_segment_anything/Grounded-Segment-Anything/mobile_sam.pt

# DINOv3 appearance embedding (per-mask, computed alongside CLIP's clip_ft -- see dino_ft)
dinov3_repo_dir: /node_data/urp26su_dongwoo/concept-graphs-project/dinov3
dinov3_checkpoint_path: ${dinov3_repo_dir}/dinov3_vith16plus_pretrain_lvd1689m-7c1da9a5.pth
dinov3_model_name: dinov3_vith16plus

# Dynamic per-scene-variant vocabulary discovery (replaces the old fixed
# classes_file: scannet200_classes.txt limited detection to ~200 ScanNet
# classes, too narrow for arbitrary scenes). See discover_scene_vocabulary()
# in utils/general_utils.py.
discovery_voxel_size: 0.1               # coarse (10x downsample_voxel_size) -- measuring which broad
                                         # regions a frame sees, not fine reconstruction detail
discovery_pixel_stride: 4               # subsample every 4th pixel when backprojecting a frame for
                                         # coverage; keeps the per-scene coverage pre-pass fast
discovery_max_representative_frames: null   # optional hard cap on greedy-selected frames (null = uncapped;
                                             # the coverage stopping criterion is already self-limiting)
discovery_sam_conf: 0.25                # SAM top-level box-confidence filter (ultralytics' own default).
                                         # Note: SAM automatic-mode point-grid density (points_stride) is NOT
                                         # exposed here -- the installed ultralytics version doesn't forward
                                         # generate()-specific kwargs through predict(), only `conf` reaches it.
discovery_sam_min_segment_area_px: 400  # drop tiny/degenerate SAM segments before spending a VLM call
                                         # on them (distinct from mask_area_threshold=25 below, which
                                         # gates a much cheaper stage -- a VLM round trip needs a higher bar)
discovery_sam_max_segment_area_ratio: 0.85  # drop near-whole-frame segments (walls/floors), analogous
                                             # to max_bbox_area_ratio but a separate knob for this stage
discovery_sam_max_segments_per_frame: 60    # hard cap on segments kept per frame after filtering (keeps
                                             # the largest); primary lever for bounding VLM call volume

bg_classes: ["wall", "floor", "ceiling"]
skip_bg: !!bool False

# Name of the folder (under <dataset_root>/<scene_id>/) that experiment
# outputs are organized into, i.e. output paths are
# <dataset_root>/<scene_id>/<exps_dir_name>/<exp_suffix|detections_exp_suffix>/
exps_dir_name: exps

force_detection: !!bool False
save_detections: !!bool True

make_edges: !!bool True
# Edge relations are built once, after all frames are processed, from the
# final point cloud (build_final_object_graph in slam/utils.py): objects get
# an edge iff their robust min surface distance is <= n * (combined radius),
# where n is auto-selected per scene as the smallest value that leaves no
# object isolated -- no manual tuning knob needed here.

# Per-object VLM captions, gathered every frame (get_vlm_captions) and consolidated
# into one caption per object at the end (consolidate_captions). Independent of
# make_edges -- edges no longer come from captions, they're derived from 3D geometry.
make_captions: !!bool False

stride: 1 # scenediff frames are already sparsely sampled during preprocessing

save_video: !!bool False
save_objects_all_frames: !!bool False

downsample_voxel_size: 0.01
obj_pcd_max_points: 5000

denoise_interval: 5           # Run DBSCAN every k frame. This operation is heavy
filter_interval: 5            # Filter objects that have too few associations or are too small
merge_interval: 5             # Merge objects based on geometric and semantic similarity
run_denoise_final_frame: !!bool True
run_filter_final_frame: !!bool True
run_merge_final_frame: !!bool True

dbscan_remove_noise: !!bool True
dbscan_eps: 0.1
dbscan_min_points: 10

# Selection criteria of the fused object point cloud
obj_min_points: 0
obj_min_detections: 1

# 2D scene graph overlay visualization: saves one PNG per frame with detections
# (image + colored mask overlay | node/edge graph diagram) under
# <exp_out_path>/scenegraph_viz/
save_scenegraph_viz: !!bool True

# Per-frame overlay of the LIVE fused map, under <exp_out_path>/fused_masks/. Written
# progressively inside the frame loop (right after each frame's own matching/merging),
# not after the whole scan finishes, so playing the frames in order shows objects
# merging over time -- two masks/numbers becoming one -- instead of only the finished
# result. Numbered by curr_obj_num (stable once an object exists, even across merges),
# but colors are positional per frame like detected_masks/filtered_masks, not fixed
# across frames. Detections that already fused into one node this frame are drawn as
# one mask. An object with no fresh detection this frame (e.g. the detector missed it)
# is not just dropped: it is still drawn, reprojected from its stored 3D point cloud,
# whenever this frame's camera should still see it -- in-frustum, unoccluded (per the
# frame's own depth map, using fusion_visibility_depth_tolerance), and with at least
# fusion_min_visible_points surviving points. Its label is suffixed "-r" to mark
# it as a geometric guess rather than an actual detection this frame.
save_fused_masks: !!bool True

# Whole-scene object graph (all persistent objects/edges in the final map,
# not per-frame): saved as <exp_out_path>/scenegraph_full.png once mapping
# finishes. Requires save_json (reads back the just-saved obj_json/edge_json).
save_scenegraph_full: !!bool True
